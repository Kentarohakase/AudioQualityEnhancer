name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release version (without leading v)
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version and tag
        id: vars
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            $tag = "${{ github.event.release.tag_name }}"
            $version = $tag.TrimStart('v')
          } else {
            $version = "${{ inputs.version }}"
            $tag = "v$version"
          }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build
        run: dotnet build -c Release

      - name: Package (without FFmpeg)
        shell: pwsh
        run: .\scripts\package-release.ps1 -Version "${{ steps.vars.outputs.version }}"

      - name: Install FFmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Package (with FFmpeg)
        shell: pwsh
        run: .\scripts\package-release.ps1 -Version "${{ steps.vars.outputs.version }}" -IncludeFFmpeg

      - name: Upload assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ steps.vars.outputs.tag }}" `
            "artifacts\AudioQualityEnhancer-${{ steps.vars.outputs.version }}-win-x64.zip" `
            "artifacts\AudioQualityEnhancer-${{ steps.vars.outputs.version }}-win-x64-with-ffmpeg.zip" `
            --clobber

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AudioQualityEnhancer-${{ steps.vars.outputs.version }}-win-x64
          path: |
            artifacts\AudioQualityEnhancer-${{ steps.vars.outputs.version }}-win-x64.zip
            artifacts\AudioQualityEnhancer-${{ steps.vars.outputs.version }}-win-x64-with-ffmpeg.zip
