name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Format
        run: dotnet format .\AudioQualityEnhancer.slnx --verify-no-changes

      - name: Build
        run: dotnet build .\AudioQualityEnhancer.slnx -c Release

      - name: Test
        run: dotnet test .\AudioQualityEnhancer.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: TestResults\**\coverage.cobertura.xml
          if-no-files-found: error
